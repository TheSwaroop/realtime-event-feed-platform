services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventfeed
      POSTGRES_PASSWORD: eventfeed
      POSTGRES_DB: eventfeed
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./apps/backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventfeed -d eventfeed"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://eventfeed:eventfeed@postgres:5432/eventfeed
      REDIS_URL: redis://redis:6379
      MAX_HISTORY_SIZE: 500
      PRESENCE_TTL_SECONDS: 90
    ports: ["4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      ORIGIN: http://localhost:5173
      PUBLIC_API_URL: http://localhost:4000
      PUBLIC_SOCKET_URL: http://localhost:4000
    ports: ["5173:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
  redis_data:
